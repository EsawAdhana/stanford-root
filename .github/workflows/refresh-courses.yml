# Required repo secrets (Settings → Secrets and variables → Actions):
#   NEXT_PUBLIC_SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
# The site serves the catalog from committed data/catalog/*.json (server-only)
# plus public/catalog/instructors.json (browser-fetched), not from a
# live DB scan, so scraping alone does not change what users see. This workflow
# scrapes, rebuilds those dumps, and commits them; the commit is what deploys.
# If schedules stop after repo inactivity: Actions → ... → enable workflows; run once via workflow_dispatch.
name: Refresh Course Data
on:
  schedule:
    - cron: '0 14 * * *' # 6:00 PT (14:00 UTC during PST; 13:00 UTC during PDT)
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      # --with-explorecourses is not optional here: Navigator has no class
      # record for ~52 catalog listings ExploreCourses does publish (CS 224U,
      # CS 217 / EE 244, most of LINGUIST), and without the flag they land in
      # the dump with empty sections and vanish from the schedule.
      - run: node scripts/scrape-sections.mjs --with-explorecourses
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Cached per academic year, so this only refetches when the catalog year
      # rolls and the three-year window moves.
      - name: Record prior-year offerings
        run: node scripts/scrape-sections.mjs --prior-years
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Rebuild catalog dumps
        run: node scripts/dump-catalog.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Which courses actually have a syllabus posted, from Stanford's own
      # syllabus service. Instructors publish mid-quarter, so this runs daily,
      # but only over the four newest terms: past terms never gain syllabi and
      # the script merges over the committed index rather than replacing it.
      # Six attempts per subject because the service strips syllabus flags from
      # a minority of responses; see the note at the top of the script. ~20
      # minutes. A failure here leaves yesterday's index in place, which
      # degrades to a disabled button rather than to a dead link.
      - name: Refresh syllabus availability index
        run: node scripts/scrape-syllabi.mjs --recent 4 --attempts 6
        continue-on-error: true
      - name: Commit refreshed dumps
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog/light.json data/catalog/full.json public/catalog/instructors.json public/syllabi/index.json scripts/prior-offerings.json
          if git diff --cached --quiet; then
            echo "Catalog and syllabus index unchanged; nothing to deploy."
          else
            git commit -m 'chore: refresh catalog dumps'
            git push
            echo "Pushed refreshed catalog; Vercel deploys from the commit."
          fi
